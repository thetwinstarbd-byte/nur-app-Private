name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Adhan sound and permission
        run: |
          mkdir -p android/app/src/main/res/raw
          if [ -f assets/adhan.wav ]; then cp assets/adhan.wav android/app/src/main/res/raw/adhan.wav; fi
          sed -i 's#<application#<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nur-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
